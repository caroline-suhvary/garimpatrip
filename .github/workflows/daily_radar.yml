name: GarimpaTrip Daily Radar Pipeline

on:
  schedule:
    # Executa todos os dias às 06:00 UTC (03:00 de Brasília)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite disparar manualmente pelo botão no GitHub

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r data-pipeline/requirements.txt

      - name: Executar Pipeline de Preços
        env:
          TRAVELPAYOUTS_API_KEY: ${{ secrets.TRAVELPAYOUTS_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python data-pipeline/pipeline_radar.py
